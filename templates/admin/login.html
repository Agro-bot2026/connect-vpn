<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — ConnectVPN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{--green:#00ff9d;--blue:#00f2ff;--bg:#030608;--glass:rgba(8,13,16,0.7);--text:#e0f0f5;--text-muted:#5a7a85;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background-image:radial-gradient(circle at 20% 30%,rgba(0,255,157,0.08),transparent 50%),radial-gradient(circle at 80% 70%,rgba(0,242,255,0.08),transparent 50%);}
  .login-card{background:var(--glass);border:1px solid rgba(0,255,157,0.3);border-radius:16px;backdrop-filter:blur(12px);padding:3rem 2.5rem;max-width:420px;width:100%;position:relative;overflow:hidden;}
  .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--blue));}
  .logo{text-align:center;margin-bottom:2rem;}
  .logo i{font-size:3rem;color:var(--green);}
  h1{font-size:1.6rem;text-align:center;margin-bottom:0.5rem;}
  .subtitle{text-align:center;color:var(--text-muted);font-family:'Space Mono',monospace;font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:2rem;}
  .form-group{margin-bottom:1.2rem;}
  label{display:block;font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:0.5rem;}
  input{width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:0.85rem 1rem;color:var(--text);font-family:'Space Mono',monospace;font-size:0.95rem;transition:border 0.2s;}
  input:focus{outline:none;border-color:var(--green);}
  .btn{width:100%;background:linear-gradient(90deg,var(--green),var(--blue));color:#030608;border:none;padding:0.95rem;border-radius:8px;font-family:'Space Mono',monospace;font-weight:700;font-size:0.9rem;letter-spacing:0.06em;cursor:pointer;transition:transform 0.15s,box-shadow 0.2s;margin-top:0.5rem;}
  .btn:hover{transform:scale(1.02);box-shadow:0 0 28px rgba(0,255,157,0.45);}
  .error{background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.3);border-radius:8px;padding:0.8rem;color:#ff6b6b;font-size:0.85rem;text-align:center;margin-bottom:1.2rem;}
  .back{text-align:center;margin-top:1.5rem;}
  .back a{color:var(--text-muted);text-decoration:none;font-size:0.85rem;}
  .back a:hover{color:var(--green);}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo"><i class="bi bi-shield-lock-fill"></i></div>
    <h1>Panel Admin</h1>
    <div class="subtitle">// acceso restringido</div>
    {% if error %}<div class="error"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>{% endif %}
    <form method="POST" action="/admin/login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="user" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
    </form>
    <div class="back"><a href="/">← Volver a la web</a></div>
  </div>
</body>
</html>
